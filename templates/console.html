  <script id="html-sdd-spec" type="application/json">__HTML_SDD_SPEC_JSON__</script>
  <script>
    (async function(){
    /*
     * 使用方法：
     * 1. 先填写 baseline，再把每条记录的 ID、证据和关联 ID 补齐。
     * 2. 代码现状和方案提案分开写；没有证据就写“待核实”。
     * 3. 只把 DDL、环境变量、Apollo 等配置放进黑色文本框，技术方案文字用说明卡片。
     */
    const spec=JSON.parse(document.getElementById("html-sdd-spec").textContent);
    const statusRegistry=__HTML_SDD_STATUSES__;
    const baseline=Object.assign({project:(spec.metadata||{}).title||''},spec.baseline||{});
    const agents=spec.agents||[];
    const readiness=(spec.metadata||{}).readiness||{};
    const requirements=spec.requirements||[];
    const plans=spec.plans||[];
    const questions=spec.questions||[];
    const normalizeInterfaceFields=items=>(items||[]).map(field=>Object.assign({},field,{name:field.name||field.field,location:field.location||field.where,description:field.description||field.desc||'',type:field.type||'string'}));
    const apis=spec.apis||[];
    const existingInterfaces=spec.existingInterfaces||[];
    const tables=spec.tables||[];
    const architecture=spec.architecture||[];
    const configs=spec.configs||[];
    const sectionCoverage=(spec.metadata||{}).sectionCoverage||{};
    const tabs=[
      ["requirements","需求"],
      ["plan","排期"],
      ["apis","接口"],
      ["existingInterfaces","现有相关接口梳理"],
      ["tables","数据表"],
      ["architecture","架构设计"],
      ["configs","上线需要配置"]
    ];
    const state={mode:"requirements",selectedId:null};
    const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const pretty=o=>typeof o==="string"?o:JSON.stringify(o,null,2);
    const list=v=>Array.isArray(v)?v:[];
    const MERMAID_CDN="https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js";
    let mermaidLoaderPromise=null;

        const script=document.createElement("script");
        script.src=MERMAID_CDN;
        script.async=true;
        script.onload=()=>window.mermaid?resolve(window.mermaid):reject(new Error("Mermaid 未提供全局对象"));
        script.onerror=()=>reject(new Error("无法加载 Mermaid CDN"));

    function expandApi(record){
      const resolve=(items,category)=>{
        if(items===undefined)return items;
        if(!Array.isArray(items))throw new Error("参数和规则必须为数组");
        return items.flatMap(item=>{
        if(!item||typeof item!=="object"||!("$ref" in item)){
          if(category==="fields"?(!item||typeof item!=="object"||Array.isArray(item)):typeof item!=="string")throw new Error("字段/规则类型错误");
          return [item];
        }
        const prefix="#/definitions/"+category+"/",ref=item.$ref;
        if(Object.keys(item).length!==1||typeof ref!=="string"||!ref.startsWith(prefix))throw new Error("无效公共引用，不能覆盖字段");
        let name=ref.slice(prefix.length);
        if(!name||name.includes("/")||/~(?![01])/.test(name))throw new Error("公共名称须按 JSON Pointer 转义");
        name=name.replace(/~1/g,"/").replace(/~0/g,"~");
        const defs=(spec.definitions||{})[category]||{};
        if(!Object.prototype.hasOwnProperty.call(defs,name))throw new Error("公共定义不存在："+ref);
        const rows=Array.isArray(defs[name])?defs[name]:[defs[name]];
        if(!rows.length||rows.some(row=>category==="fields"?(!row||typeof row!=="object"||Array.isArray(row)||("$ref" in row)||typeof row.field!=="string"||!row.field.trim()):(typeof row!=="string"||!row.trim())))throw new Error("公共定义类型错误："+ref);
        return rows;
      })};
      return {...record,request:normalizeInterfaceFields(resolve(record.request,"fields")),response:normalizeInterfaceFields(resolve(record.response,"fields")),rules:resolve(record.rules,"rules")};
    }
    function rulesBlock(rules){

    function renderArchitecture(x){
      if(x.type==="solution"){
        return "<div class=\"card\"><div class=\"card-head\"><div><h1>"+esc(x.title)+"</h1><small><span class=\"record-id\">"+esc(x.id)+"</span> · "+esc(x.group)+"</small></div>"+status(x.status,"architecture",x.statusNote)+"</div><div class=\"card-body\">"+statusNoteBlock(x,"architecture")+"<div class=\"solution-grid\"><div class=\"solution-section\"><h3>怎么做</h3><p>"+esc(x.conclusion)+"</p></div><div class=\"solution-section\"><h3>现在的情况</h3><p>"+esc(x.current)+"</p></div><div class=\"solution-section\"><h3>主要做法</h3><ol>"+list(x.steps).map(s=>"<li>"+esc(s)+"</li>").join("")+"</ol></div><div class=\"solution-section\"><h3>涉及哪些内容</h3><p>"+esc(x.impact)+"</p></div><div class=\"solution-section\"><h3>注意事项</h3><p>"+esc(x.risks)+"</p></div></div>"+relatedBlock(x)+"</div></div>";
      }
      const engine=x.diagramEngine||(x.diagramSource?"mermaid":"svg/fallback");
      const useMermaid=x.diagramSource&&engine==="mermaid";
      const diagram=x.diagramSvg&&engine!=="mermaid"?"<div class=\"diagram-view\">"+x.diagramSvg+"</div>":useMermaid?mermaidDiagram(x.diagramSource,x.fallback):"<div class=\"diagram-view\"><pre class=\"diagram-fallback\">"+esc(x.fallback||"待补充图形或文字说明")+"</pre></div>";
      return "<div class=\"card\"><div class=\"card-head\"><div><h1>"+esc(x.title)+"</h1><small><span class=\"record-id\">"+esc(x.id)+"</span> · "+esc(x.diagramType||"diagram")+" · "+esc(engine)+" · "+esc(x.group)+"</small></div>"+status(x.status,"architecture",x.statusNote)+"</div><div class=\"card-body\">"+statusNoteBlock(x,"architecture")+"<div class=\"section\"><h3>图要表达什么</h3><p>"+esc(x.summary||"待补充")+"</p></div><div class=\"diagram-panel\"><div class=\"diagram-label\">图形</div>"+diagram+"<div class=\"diagram-label\">图源（网络不可用时可读）</div><pre class=\"text-box\">"+esc(x.diagramSource||x.fallback||"待补充")+"</pre></div>"+relatedBlock(x)+"</div></div>";
    }
    function renderConfigs(x){
      return "<div class=\"card\"><div class=\"card-head\"><div><h1>"+esc(x.title)+"</h1><small><span class=\"record-id\">"+esc(x.id)+"</span> · "+esc(x.kind)+" · "+esc(x.environment)+"</small></div>"+status(x.status,"configs",x.statusNote)+"</div><div class=\"card-body\">"+statusNoteBlock(x,"configs")+""+(x.source?"<p class=\"delivery-note\" title=\""+esc(x.source)+"\">执行来源：<code>"+esc(x.source)+"</code></p>":"")+"<div class=\"section\"><h3>上线配置内容</h3><pre class=\"text-box\">"+esc(x.content||"-- 待补充")+"</pre></div>"+relatedBlock(x)+"</div></div>";
    }
    const scheduleState={status:"",sort:"priority",group:true};
    function scheduleRows(){
      const used=new Set(plans.filter(p=>Number.isSafeInteger(p.sequence)&&p.sequence>0).map(p=>p.sequence));
      let next=1;
      const rows=plans.map(p=>{if(Number.isSafeInteger(p.sequence)&&p.sequence>0)return {...p};while(used.has(next))next++;used.add(next);return {...p,sequence:next++}}).filter(p=>!scheduleState.status||p.status===scheduleState.status);
      const rank=p=>({P0:0,P1:1,P2:2}[p.priority]??3);
      rows.sort((a,b)=>scheduleState.sort==="sequence"?a.sequence-b.sequence:(scheduleState.sort==="reverse"?rank(b)-rank(a):rank(a)-rank(b))||a.sequence-b.sequence);
      if(!scheduleState.group)return rows;
      const groups=new Map();rows.forEach(p=>{const key=p.module||"未分组";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});
      return [...groups.values()].flat();
    }
    function scheduleControls(count){
      const option=(value,label,current)=>"<option value=\""+esc(value)+"\""+(value===current?" selected":"")+">"+esc(label)+"</option>";
      return "<div class=\"schedule-controls\"><label>状态<select aria-label=\"排期状态\" data-schedule=\"status\">"+[["","全部状态"],...PLAN_STATUS_ENUM.map(x=>[x,x])].map(([v,l])=>option(v,l,scheduleState.status)).join("")+"</select></label><label>排序<select aria-label=\"排期排序\" data-schedule=\"sort\">"+[["priority","优先级高到低，再按序号"],["reverse","优先级低到高，再按序号"],["sequence","序号从小到大"]].map(([v,l])=>option(v,l,scheduleState.sort)).join("")+"</select></label><label class=\"schedule-group\" title=\"归类时在模块内排序；任务序号保持不变\"><input type=\"checkbox\" aria-label=\"按模块归类\" data-schedule=\"group\""+(scheduleState.group?" checked":"")+">按模块归类</label><span>"+count+" / "+plans.length+" 项</span><button type=\"button\" data-schedule-reset>恢复默认</button></div>";
    }
    function planNote(p){
      const values=[p.blocker,p.progress,p.note,p.statusNote].filter(v=>typeof v==="string"&&v.trim()).map(v=>v.trim());
      const unique=[...new Set(values)];
      if(typeof p.blocker==="string"&&p.blocker.trim())unique[0]="阻塞说明："+unique[0];
      else if(p.status==="阻塞")unique.unshift("阻塞原因待补充");
      return unique.join("；")||"—";
    }
    function requirementLabel(id){const r=requirements.find(x=>x.id===id);return r?r.id+" "+r.title:id}
    function renderPlan(){
      const done=plans.filter(p=>p.status==="已完成").length;
      const doing=plans.filter(p=>p.status==="进行中").length;
      const blocked=plans.filter(p=>p.status==="阻塞").length;
      const groups=[...new Set(plans.map(p=>p.module))];
      const visible=scheduleRows();
      const rows=visible.map((p,i)=>{
        const groupClass="module-"+(groups.indexOf(p.module)%5);
        const requirementIds=list(p.requirementIds);
        const reqChips=requirementIds.map(id=>{
          const r=requirements.find(x=>x.id===id);
          return r?"<button type=\"button\" class=\"plan-req\" data-plan-requirement=\""+esc(id)+"\" title=\""+esc(requirementLabel(id))+"\">"+esc(r.title)+"</button>":"<span class=\"plan-req\">"+esc(id)+"</span>";
        }).join("");
        const paths=Array.isArray(p.ownerPaths)?p.ownerPaths.join("、"):(p.ownerPaths||"—");
        const note=planNote(p);
        const detailItems=[["任务编号",p.id],["子任务",p.sub,true],["关联需求",requirementIds.map(requirementLabel).join("、"),true],["负责人",agentName(p.owner)],["审核人",roleNames(p.reviewer,p.reviewerIds)],["执行人",roleNames(p.executor,p.executorIds)],["批次",p.batch],["预估",p.effort],["计划开始",p.start],["预计完成",p.end||"待定"],["依赖",p.deps],["文件范围",paths,true],["进展与备注",note==="—"?null:note,true],["验收标准",p.acceptanceCriteria,true],["验证结果",p.verification,true]];
        const details=detailItems.filter(item=>item[1]!==undefined&&item[1]!==null&&item[1]!==""&&!(Array.isArray(item[1])&&!item[1].length)).map(item=>"<div class=\"plan-detail"+(item[2]?" wide":"")+"\"><b>"+esc(item[0])+"</b><span>"+esc(typeof item[1]==="string"?item[1]:pretty(item[1]))+"</span></div>").join("");
        const detailId="plan-details-"+p.sequence;
        return "<tr data-plan-id=\""+esc(p.id)+"\" class=\""+groupClass+(scheduleState.group&&(i===0||visible[i-1].module!==p.module)?" plan-module-start":"")+"\"><td class=\"mono\">"+p.sequence+"</td><td><strong>"+esc(p.priority||"—")+"</strong></td><td><div class=\"plan-task\"><strong>"+esc(p.module||"未分组")+"</strong><button class=\"plan-toggle\" type=\"button\" data-plan-toggle aria-expanded=\"false\" aria-controls=\""+detailId+"\">"+esc(p.main||"未填写")+"</button></div></td><td><div class=\"plan-reqs\">"+(reqChips||"—")+"</div></td><td><span class=\"plan-preview\" title=\""+esc(roleNames(p.executor,p.executorIds))+"\">"+esc(roleNames(p.executor,p.executorIds))+"</span></td><td>"+planStatus(p.status)+"</td><td><span class=\"plan-preview\" title=\""+esc(note)+"\">"+esc(note)+"</span></td></tr><tr id=\""+detailId+"\" class=\"plan-details-row "+groupClass+"\" hidden><td colspan=\"7\"><div class=\"plan-details-grid\">"+details+"</div>"+relatedBlock(p)+"</td></tr>";
      }).join("");
      return scheduleControls(visible.length)+"<div class=\"summary-grid\"><div class=\"summary\"><div class=\"summary-label\">全部任务</div><div class=\"summary-value\">"+plans.length+"</div><div class=\"summary-note\">已完成 "+done+" 项</div></div><div class=\"summary\"><div class=\"summary-label\">进行中</div><div class=\"summary-value\">"+doing+"</div><div class=\"summary-note\">按当前排期状态</div></div><div class=\"summary\"><div class=\"summary-label\">存在阻塞</div><div class=\"summary-value\">"+blocked+"</div><div class=\"summary-note\">点击任务查看原因</div></div></div><div class=\"plan-wrap\"><table class=\"plan-table\"><thead><tr><th>序号</th><th>优先级</th><th>模块 / 任务</th><th>关联需求</th><th>执行人</th><th>状态</th><th>进展与备注</th></tr></thead><tbody>"+(rows||"<tr><td colspan=\"7\">没有匹配任务</td></tr>")+"</tbody></table></div>";
    }
    function render(){
      renderTabs();renderSnapshot();renderCatalog();
      const arr=state.mode==="plan"?[]:allItems(state.mode);
      if(state.mode!=="plan"){
        document.getElementById("shell").classList.remove("plan-mode");
        if(!arr.length){state.selectedId=null;document.getElementById("detail").innerHTML=catalogFilters[state.mode]?"<div class=\"empty\">没有匹配条目</div>":emptyState(state.mode);return}
        const x=arr.find(y=>y.id===state.selectedId)||arr[0];
        state.selectedId=x.id;
        document.getElementById("catalog").querySelectorAll("[data-record]").forEach(b=>b.classList.toggle("active",b.dataset.record===x.id));
        const body=state.mode==="requirements"?renderRequirements(x):state.mode==="apis"?renderApis(x):state.mode==="existingInterfaces"?renderExistingInterfaces(x):state.mode==="tables"?renderTables(x):state.mode==="architecture"?renderArchitecture(x):renderConfigs(x);
        document.getElementById("detail").innerHTML=body+"<p class=\"footer-note\">本页面是人和 AI 的对齐记录；它不会读取实时仓库或数据库，也不会自动执行 DDL 和上线配置。</p>";
        document.getElementById("shell").classList.remove("plan-mode");
        if(state.mode==="architecture")renderMermaidDiagrams();
        return;
      }
      document.getElementById("shell").classList.add("plan-mode");
      document.getElementById("detail").innerHTML="<header class=\"page-head\"><h1 class=\"page-title\">需求排期</h1></header>"+(plans.length?renderPlan():emptyState("plan"))+"<p class=\"footer-note\">排期只记录协作安排和当前进度；代码、DDL、配置和验证证据分别放在对应分类。</p>";
      document.querySelectorAll("[data-schedule]").forEach(control=>control.onchange=()=>{scheduleState[control.dataset.schedule]=control.type==="checkbox"?control.checked:control.value;render()});
      document.querySelectorAll("[data-schedule-reset]").forEach(button=>button.onclick=()=>{Object.assign(scheduleState,{status:"",sort:"priority",group:true});render()});
      document.querySelectorAll("[data-plan-requirement]").forEach(button=>button.onclick=()=>{state.mode="requirements";state.selectedId=button.dataset.planRequirement;render()});
      document.querySelectorAll("[data-plan-toggle]").forEach(button=>button.onclick=()=>{
        const row=button.closest("tr").nextElementSibling;
        row.hidden=!row.hidden;
        button.setAttribute("aria-expanded",String(!row.hidden));

      });
    }
    const closeSnapshotPanels=()=>document.getElementById("snapshot").querySelectorAll(":scope > details[open]").forEach(details=>details.open=false);
    document.addEventListener("click",event=>{if(!document.getElementById("snapshot").contains(event.target))closeSnapshotPanels()});
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closeSnapshotPanels()});
    window.__HTML_SDD__={baseline,agents,requirements,plans,apis,existingInterfaces,tables,architecture,configs,questions,readiness,sectionCoverage};
    render();
    })();
  </script>
</body>
</html>
