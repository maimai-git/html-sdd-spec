name: validate-html-sdd

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps -w /tmp/html-sdd-wheel
          python -m venv /tmp/html-sdd-venv
          /tmp/html-sdd-venv/bin/python -m pip install --no-index /tmp/html-sdd-wheel/*.whl
          /tmp/html-sdd-venv/bin/html-sdd --version
          /tmp/html-sdd-venv/bin/html-sdd check examples/asset-library/sdd.json
          /tmp/html-sdd-venv/bin/html-sdd context examples/asset-library/sdd.json REQ-001 --role executor --full --json > /tmp/html-sdd-context.json
      - name: Run the quick-start example with the installed CLI
        run: |
          sample="$PWD/examples/订单状态筛选/方案事实源.json"
          cd "$(mktemp -d)"
          cli=/tmp/html-sdd-venv/bin/html-sdd
          "$cli" init html-sdd-spec/订单状态筛选
          cd html-sdd-spec/订单状态筛选
          "$cli" check 方案事实源.json
          grep -q "vue.global.prod.js" 方案对齐.html
          cp "$sample" 方案事实源.json
          "$cli" check 方案事实源.json
          "$cli" summary 方案事实源.json --json > summary.json
          "$cli" render 方案事实源.json --output 方案对齐.html
          "$cli" render 方案事实源.json --template classic --output Classic版.html
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          summary = json.loads(Path("summary.json").read_text(encoding="utf-8"))
          for key, record_id in (
              ("pendingPlans", "PLAN-002"),
              ("acceptanceGaps", "AC-002"),
              ("deliveryGaps", "API-001"),
          ):
              assert [item["id"] for item in summary[key]] == [record_id], summary[key]

          source = json.loads(Path("方案事实源.json").read_text(encoding="utf-8"))
          for stem in ("方案对齐", "Classic版"):
              html = Path(stem + ".html").read_text(encoding="utf-8")
              assert ("vue.global.prod.js" in html) == (stem == "方案对齐"), stem
              payload = re.search(r'<script id="html-sdd-spec" type="application/json">(.*?)</script>', html, re.S)
              assert payload is not None, stem
              assert json.loads(payload[1]) == source, stem
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              assert scripts, stem
              Path(stem + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check 方案对齐.js
          node --check Classic版.js

  vue-browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel and Playwright
        run: |
          python -m pip wheel . --no-deps -w /tmp/html-sdd-wheel
          python -m pip install /tmp/html-sdd-wheel/*.whl playwright==1.59.0
          python -m playwright install --with-deps chromium
      - name: Compare Vue with the CLI summary
        run: python tests/browser/summary.py
