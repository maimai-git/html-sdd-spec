<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>HTML SDD Spec 文件资产库、风格模特与 Chat 引用后端一期</title>
  <style>
    :root{--ink:#182230;--muted:#475569;--line:#d7dee8;--canvas:#f5f7fb;--paper:#fff;--side:#f8fafc;--side-hover:#edf2fa;--accent:#254b86;--accent-soft:#eaf0fb;--success:#166534;--success-soft:#ecfdf3;--blue:#1d4ed8;--blue-soft:#eff6ff;--amber:#854d0e;--amber-soft:#fff7e6;--red:#b42318;--red-soft:#fef3f2;--violet:#6d28d9;--violet-soft:#f5f3ff;--shadow:none}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}code{font-size:.92em;overflow-wrap:anywhere}
    .topbar{height:48px;position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:11px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.brand-mark{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;background:var(--accent);color:#fff;font:800 15px ui-monospace,monospace}.brand{font-size:16px;font-weight:800}.project-title{overflow:hidden;color:var(--muted);font-size:15px;text-overflow:ellipsis;white-space:nowrap}.document-state{margin-left:auto;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tabbar{height:40px;position:sticky;top:48px;z-index:7;display:flex;align-items:stretch;gap:3px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}.tab{position:relative;flex:0 0 auto;padding:0 14px;border:0;background:transparent;color:#475569;font-size:15px;font-weight:800;white-space:nowrap}.tab:hover{background:#f1f5f9;color:var(--ink)}.tab.active{color:var(--accent)}.tab.active:after{position:absolute;right:10px;bottom:-1px;left:10px;height:2px;background:var(--accent);content:""}
    .snapshot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:relative;z-index:6;max-width:none;margin:0;padding:4px 18px;border-bottom:1px solid var(--line);background:#fff}.snapshot-item{min-width:0;padding:9px 11px;background:#fff;border:1px solid var(--line);border-radius:8px}.snapshot-label{color:var(--muted);font-size:12px}.snapshot-value{margin-top:2px;overflow:hidden;font-size:14px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .shell{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 126px);max-width:none;margin:0 auto}.shell.plan-mode{display:block}.shell.plan-mode .sidebar{display:none}.sidebar{position:sticky;top:88px;height:calc(100vh - 88px);overflow:auto;padding:10px 8px 24px;background:var(--side);border-right:1px solid var(--line)}.catalog-title{padding:0 8px 6px;color:#334155;font-size:14px;font-weight:700}.catalog-count{float:right;color:#64748b;font-size:12px;font-weight:600}.catalog-group{margin-top:8px}.catalog-group:first-child{margin-top:0}.catalog-group-heading{display:flex;align-items:center;gap:6px;padding:3px 8px;color:#334155;font-size:15px;font-weight:700;line-height:20px}.catalog-group-heading:before{width:3px;height:13px;border-radius:2px;background:var(--accent);content:""}.catalog-item:hover{background:var(--side-hover);color:var(--ink)}.catalog-item.active{background:var(--accent-soft);color:#1e3a5f;box-shadow:inset 2px 0 var(--accent)}
    main{min-width:0;padding:16px 24px 44px}.detail{max-width:none;margin:0 auto}.page-head{padding:2px 0 15px;border-bottom:1px solid var(--line)}.page-kicker{margin:0 0 5px;color:var(--muted);font-size:12px;font-weight:800}.page-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.page-title{margin:0;font-size:28px;line-height:1.3;overflow-wrap:anywhere}.page-intro{margin:6px 0 0;color:#475569;font-size:15px}.page-meta{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:10px;color:var(--muted);font-size:12px}.page-meta b{color:#334155}.card{margin:0 0 14px;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.card-head h1,.card-head h2{margin:0;font-size:22px;line-height:1.4;overflow-wrap:anywhere}.card-head>div:first-child{min-width:0}.interface-summary{margin:0 0 14px;font-size:16px}.card-head small{color:var(--muted);font-size:14px}.card-body{padding:16px}.section{margin:0 0 18px}.section:last-child{margin-bottom:0}.section h3{margin:0 0 8px;color:#334155;font-size:15px}.section p{margin:0;color:var(--ink);font-size:16px}.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.solution-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.solution-section{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fafcff}.solution-section h3{margin:0 0 6px;font-size:14px}.solution-section p{margin:0;color:#334155;font-size:16px}.solution-section ol,.solution-section ul{margin:0;padding-left:18px;color:#334155;font-size:16px}.solution-section li+li{margin-top:4px}
    .status,.change-type,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;white-space:nowrap}.change-type.new{background:var(--blue-soft);color:var(--blue)}.change-type.existing{background:var(--amber-soft);color:var(--amber)}.change-type.reuse{background:var(--success-soft);color:var(--success)}.tag{border:1px solid #cbd5e1;background:#fff;color:#475569;font:700 12px ui-monospace,monospace}.tag-list{display:flex;flex-wrap:wrap;gap:6px}.callout{padding:10px 12px;border-left:3px solid var(--accent);border-radius:5px;background:var(--accent-soft);color:#1e3a5f;font-size:14px}.callout.warn{border-color:#d39a3e;background:var(--amber-soft);color:#754509}
    .param-grid,.instance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.param-pane{min-width:0}.param-pane h3,.instance-pane h3{margin:0 0 8px;font-size:15px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px;background:#fff}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 9px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f1f5f9;color:#475569;font-weight:800;white-space:nowrap}tr:last-child td{border-bottom:0}.field-name{font:700 14px ui-monospace,monospace;color:#1e3a5f}.instance-pane{min-width:0}.instance-box,.text-box{margin:0;overflow:auto;padding:12px;border-radius:7px;background:#111827;color:#f8fafc;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.text-box{min-height:66px}.diagram-panel{display:grid;gap:10px}.diagram-view{min-height:180px;display:grid;place-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fafcff}.diagram-view svg{max-width:100%;height:auto}.diagram-view-mermaid{display:grid;gap:8px;place-items:center}.diagram-view-mermaid .mermaid{width:100%;margin:0;overflow:auto;text-align:center}.diagram-view-mermaid .mermaid svg{max-width:100%;height:auto}.diagram-fallback{margin:0;width:100%;white-space:pre-wrap;font:14px/1.6 ui-monospace,monospace;color:#334155}.diagram-fallback-note{margin:0;color:var(--muted);font-size:12px;text-align:center}.diagram-label{color:var(--muted);font-size:12px;font-weight:800}.related{margin-top:13px}.related h3{margin:0 0 7px;color:#334155;font-size:14px}
    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.summary{padding:12px 13px;background:#fff;border:1px solid var(--line);border-radius:8px}.summary-label{color:var(--muted);font-size:12px}.summary-value{margin-top:2px;font-size:24px;font-weight:800}.summary-note{margin-top:2px;color:var(--muted);font-size:12px}.plan-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}.plan-table{width:100%;min-width:1280px;border-collapse:collapse;font-size:14px}.plan-table th{padding:10px 9px;background:#eef2f8;color:#475569;font-size:14px}.plan-table td{padding:10px 9px;border-bottom:1px solid #e2e8f0;vertical-align:top}.plan-table tbody tr:last-child td{border-bottom:0}.plan-table tbody tr:hover{filter:brightness(.985)}.plan-table .status{font-size:14px;display:inline-block;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.4;text-align:center}.module-0{background:#fafcff}.module-1{background:#eff6ff}.module-2{background:#fffbeb}.module-3{background:#f5f3ff}.module-4{background:#fff1f2}
    .empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:8px}.footer-note{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);color:#526176;font-size:12px}
    /* Keep the first screen focused on status; reveal implementation detail on demand. */

    .snapshot-summary{display:none}
    .snapshot-version{position:relative;margin:0;padding:0;color:var(--muted);font-size:13px}
    .snapshot-version>summary{display:block;padding:3px 8px;line-height:24px;font-size:13px;font-weight:600;cursor:pointer;list-style:none}
    .snapshot-version>summary::-webkit-details-marker,.readiness-summary::-webkit-details-marker,.disclosure>summary::-webkit-details-marker{display:none}
    .snapshot-version>summary:before,.disclosure>summary:before{content:"＋";display:inline-block;width:18px;color:var(--accent);font-weight:800}
    .snapshot-version[open]>summary:before,.disclosure[open]>summary:before{content:"－"}
    .version-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
    .readiness-card{padding:0}
    .readiness-summary{display:block;padding:3px 8px;line-height:24px;font-size:13px;font-weight:600;cursor:pointer;list-style:none}
    .readiness-summary>span:first-child{display:grid;gap:2px}
    .readiness-summary strong{font-size:16px}
    .readiness-summary small{color:var(--muted);font-size:14px}
    .readiness-summary-meta{display:flex;align-items:center;gap:10px;min-width:0}
    .readiness-summary-meta .status{max-width:280px;overflow:hidden;text-overflow:ellipsis}
    .disclosure-label{color:var(--accent);font-size:14px;font-weight:700;white-space:nowrap}
    .disclosure{margin:10px 0;border:1px solid var(--line);border-radius:7px;background:#fff}
    .disclosure>summary{padding:9px 11px;cursor:pointer;color:#334155;font-size:14px;font-weight:700;list-style:none}
    .disclosure-content{padding:0 11px 12px}
    .disclosure .section{margin:0}
    .instance-grid{margin-top:12px!important}
    .instance-box{max-height:420px}
    .text-disclosure .text-box{max-height:560px}
    .related-disclosure{margin-top:12px}
    .related-disclosure .related{margin:0}
    .acceptance-disclosure{margin-top:10px}
    .shell.plan-mode{max-width:none}
    .plan-table{min-width:1280px;table-layout:fixed}
    .plan-table th:nth-child(1),.plan-table td:nth-child(1){width:60px}
    .plan-table th:nth-child(2),.plan-table td:nth-child(2){width:70px}
    .plan-table th:nth-child(3),.plan-table td:nth-child(3){width:22%}
    .plan-table th:nth-child(4),.plan-table td:nth-child(4){width:170px}
    .plan-table th:nth-child(5),.plan-table td:nth-child(5){width:145px}
    .plan-table th:nth-child(6),.plan-table td:nth-child(6){width:120px}
    .plan-table th:nth-child(7),.plan-table td:nth-child(7){width:100px}
    .plan-task{display:grid;gap:5px;min-width:0}
    .plan-task strong{font-size:14px}
    .plan-preview{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
    .plan-reqs{display:grid;gap:5px}
    .plan-req{display:inline-block;padding:2px 5px;border-radius:4px;background:#fff;color:#334155;font-family:inherit;font-size:12px;font-weight:400;text-align:left;border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
    button.plan-req{cursor:pointer}
    .plan-toggle{padding:0;border:0;background:transparent;color:var(--accent);font:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere;line-height:1.5}
    .plan-toggle:hover{text-decoration:underline}
    .plan-toggle:before{content:"▸ ";color:var(--muted)}
    .plan-toggle[aria-expanded="true"]:before{content:"▾ "}
    .plan-details-row[hidden]{display:none!important}
    .plan-details-row td{padding:12px 14px;background:rgba(255,255,255,.82)}
    .plan-details-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}
    .plan-detail{min-width:0;display:grid;gap:2px}
    .plan-detail.wide{grid-column:1/-1}
    .plan-detail b{color:var(--muted);font-size:14px}
    .plan-detail span{overflow-wrap:anywhere;font-size:14px}

    .page-meta{display:none}
    .snapshot .readiness-card{position:relative;margin:0;padding:0;border:0;overflow:visible;background:transparent;box-shadow:none}.question-summary{margin:8px 0;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:15px}.question-summary strong{font-size:16px}.question-summary p{margin:5px 0;color:var(--muted)}.question-summary ul{margin:6px 0;padding-left:18px}.question-summary li+li{margin-top:6px}.question-summary small{display:block;color:var(--muted);font-size:14px}.question-summary details{margin-top:6px}.question-summary summary{cursor:pointer;color:var(--accent);font-weight:700}
    @media print{.topbar,.tabbar,.sidebar,.snapshot{display:none}.shell,.shell.plan-mode{display:block;min-height:0}main{padding:0}.detail{max-width:none}.card,.plan-wrap{box-shadow:none}.table-wrap,.plan-wrap,.instance-box,.text-box{overflow:visible}.disclosure:not([open])>*:not(summary){display:block}.plan-details-row[hidden]{display:table-row}}

    .snapshot-version>summary:before{display:none}

    .snapshot-questions{position:relative}

    .snapshot-questions>summary{padding:3px 8px;line-height:24px;font-size:13px;font-weight:600;cursor:pointer;list-style:none;color:var(--accent)}

    .snapshot-panel{position:absolute;left:0;top:calc(100% + 4px);width:min(760px,calc(100vw - 36px));max-height:60vh;overflow:auto;padding:16px;background:#fff;border:1px solid var(--line);border-radius:8px}

    .snapshot-panel.version-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:0}

    .snapshot-panel .question-summary{margin:0;padding:0;border:0}

    .catalog-filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 6px;margin-bottom:6px}

    .catalog-filters label{display:grid;gap:3px;font-size:12px;color:var(--muted)}

    .catalog-filters select{width:100%;min-width:0;padding:5px 4px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:inherit;font-size:13px;line-height:1.4}

    .catalog-filters button{grid-column:1/-1;justify-self:end;padding:2px 0;border:0;background:transparent;color:var(--accent);font-size:12px}

    .delivery-note{margin:0 0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}
    .plan-module-start>td{border-top:2px solid var(--line)}
    .schedule-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;margin:0 0 14px;font-size:14px}.schedule-controls label{display:flex;align-items:center;gap:7px}.schedule-controls select{padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:inherit}.schedule-controls button{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--accent);font:inherit}.schedule-controls span{color:var(--muted)}.schedule-group input{width:16px;height:16px;accent-color:var(--accent)}
.catalog-item{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:3px;margin:2px 0;padding:6px 8px;border:0;border-radius:5px;background:transparent;color:#334155;text-align:left}
.catalog-name{display:block;min-width:0;overflow:hidden;font-size:14px;line-height:20px;text-overflow:ellipsis;white-space:nowrap}
.catalog-path{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text;font:13px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#475569}
.catalog-tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
.catalog-tag{display:inline-flex;align-items:center;max-width:100%;min-height:20px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.catalog-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.catalog-tags .status,.catalog-tags .change-type{padding:1px 6px;border-radius:4px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.catalog-count{padding:0 6px;border:1px solid var(--line);border-radius:4px;background:#f1f5f9;color:#475569;line-height:18px}

    .record-id{color:#64748b;font:400 12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .related .tag{padding:0 5px;border-color:#e2e8f0;border-radius:4px;background:transparent;color:#64748b;font:400 11px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .plan-req{padding:1px 4px;background:transparent;color:#64748b;font:400 12px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .status.done{color:#166534;background:#ecfdf3}.catalog-status.done{color:#166534}
.status.progress{color:#1d4ed8;background:#eff6ff}.catalog-status.progress{color:#1d4ed8}
.status.wait{color:#854d0e;background:#fff7e6}.catalog-status.wait{color:#854d0e}
.status.review{color:#6d28d9;background:#f5f3ff}.catalog-status.review{color:#6d28d9}
.status.blocked{color:#b42318;background:#fef3f2}.catalog-status.blocked{color:#b42318}
.status.neutral{color:#475569;background:#f1f5f9}.catalog-status.neutral{color:#475569}
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand-mark" aria-hidden="true">S</span>
    <span class="brand">HTML SDD Spec</span>
    <span class="project-title" id="projectTitle"></span>
    <span class="document-state" id="documentState">状态待记录</span>
  </header>
  <nav class="tabbar" id="tabs" aria-label="文档分类"></nav>
  <section class="snapshot" id="snapshot" aria-label="当前版本快照"></section>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="当前分类目录">
      <div class="catalog-title"><span id="catalogTitle">需求清单</span><span class="catalog-count" id="catalogCount"></span></div>
      <nav id="catalog" aria-label="条目清单"></nav>
    </aside>

    function expandApi(record){
      const resolve=(items,category)=>{
        if(items===undefined)return items;
        if(!Array.isArray(items))throw new Error("参数和规则必须为数组");
        return items.flatMap(item=>{
        if(!item||typeof item!=="object"||!("$ref" in item)){
          if(category==="fields"?(!item||typeof item!=="object"||Array.isArray(item)):typeof item!=="string")throw new Error("字段/规则类型错误");
          return [item];
        }
        const prefix="#/definitions/"+category+"/",ref=item.$ref;
        if(Object.keys(item).length!==1||typeof ref!=="string"||!ref.startsWith(prefix))throw new Error("无效公共引用，不能覆盖字段");
        let name=ref.slice(prefix.length);
        if(!name||name.includes("/")||/~(?![01])/.test(name))throw new Error("公共名称须按 JSON Pointer 转义");
        name=name.replace(/~1/g,"/").replace(/~0/g,"~");
        const defs=(spec.definitions||{})[category]||{};
        if(!Object.prototype.hasOwnProperty.call(defs,name))throw new Error("公共定义不存在："+ref);
        const rows=Array.isArray(defs[name])?defs[name]:[defs[name]];
        if(!rows.length||rows.some(row=>category==="fields"?(!row||typeof row!=="object"||Array.isArray(row)||("$ref" in row)||typeof row.field!=="string"||!row.field.trim()):(typeof row!=="string"||!row.trim())))throw new Error("公共定义类型错误："+ref);
        return rows;
      })};
      return {...record,request:normalizeInterfaceFields(resolve(record.request,"fields")),response:normalizeInterfaceFields(resolve(record.response,"fields")),rules:resolve(record.rules,"rules")};
    }
    function rulesBlock(rules){

    const scheduleState={status:"",sort:"priority",group:true};
    function scheduleRows(){
      const used=new Set(plans.filter(p=>Number.isSafeInteger(p.sequence)&&p.sequence>0).map(p=>p.sequence));
      let next=1;
      const rows=plans.map(p=>{if(Number.isSafeInteger(p.sequence)&&p.sequence>0)return {...p};while(used.has(next))next++;used.add(next);return {...p,sequence:next++}}).filter(p=>!scheduleState.status||p.status===scheduleState.status);
      const rank=p=>({P0:0,P1:1,P2:2}[p.priority]??3);
      rows.sort((a,b)=>scheduleState.sort==="sequence"?a.sequence-b.sequence:(scheduleState.sort==="reverse"?rank(b)-rank(a):rank(a)-rank(b))||a.sequence-b.sequence);
      if(!scheduleState.group)return rows;
      const groups=new Map();rows.forEach(p=>{const key=p.module||"未分组";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});
      return [...groups.values()].flat();
    }

    }
    function requirementLabel(id){const r=requirements.find(x=>x.id===id);return r?r.id+" "+r.title:id}
    function renderPlan(){
      const done=plans.filter(p=>p.status==="已完成").length;
      const doing=plans.filter(p=>p.status==="进行中").length;
      const blocked=plans.filter(p=>p.status==="阻塞").length;
      const groups=[...new Set(plans.map(p=>p.module))];
      const visible=scheduleRows();
      const rows=visible.map((p,i)=>{
        const groupClass="module-"+(groups.indexOf(p.module)%5);
        const requirementIds=list(p.requirementIds);
        const reqChips=requirementIds.map(id=>{
          const r=requirements.find(x=>x.id===id);
          return r?"<button type=\"button\" class=\"plan-req\" data-plan-requirement=\""+esc(id)+"\" title=\""+esc(requirementLabel(id))+"\">"+esc(r.title)+"</button>":"<span class=\"plan-req\">"+esc(id)+"</span>";
        }).join("");
        const paths=Array.isArray(p.ownerPaths)?p.ownerPaths.join("、"):(p.ownerPaths||"—");
        const detailItems=[["任务编号",p.id],["子任务",p.sub,true],["关联需求",requirementIds.map(requirementLabel).join("、"),true],["负责人",agentName(p.owner)],["审核人",roleNames(p.reviewer,p.reviewerIds)],["执行人",roleNames(p.executor,p.executorIds)],["批次",p.batch],["预估",p.effort],["计划开始",p.start],["预计完成",p.end||"待定"],["依赖",p.deps],["文件范围",paths,true],["最新进度",p.progress,true],["备注",p.note,true],["状态说明",p.statusNote,true],["阻塞原因",p.blocker,true],["验收标准",p.acceptanceCriteria,true],["验证结果",p.verification,true]];
        const details=detailItems.filter(item=>item[1]!==undefined&&item[1]!==null&&item[1]!==""&&!(Array.isArray(item[1])&&!item[1].length)).map(item=>"<div class=\"plan-detail"+(item[2]?" wide":"")+"\"><b>"+esc(item[0])+"</b><span>"+esc(typeof item[1]==="string"?item[1]:pretty(item[1]))+"</span></div>").join("");
        const note=planNote(p),detailId="plan-details-"+p.sequence;
        return "<tr data-plan-id=\""+esc(p.id)+"\" class=\""+groupClass+(scheduleState.group&&(i===0||visible[i-1].module!==p.module)?" plan-module-start":"")+"\"><td class=\"mono\">"+p.sequence+"</td><td><strong>"+esc(p.priority||"—")+"</strong></td><td><div class=\"plan-task\"><strong>"+esc(p.module||"未分组")+"</strong><button class=\"plan-toggle\" type=\"button\" data-plan-toggle aria-expanded=\"false\" aria-controls=\""+detailId+"\">"+esc(p.main||"未填写")+"</button></div></td><td><div class=\"plan-reqs\">"+(reqChips||"—")+"</div></td><td><span class=\"plan-preview\" title=\""+esc(roleNames(p.executor,p.executorIds))+"\">"+esc(roleNames(p.executor,p.executorIds))+"</span></td><td>"+esc(planEnd(p.end))+"</td><td>"+planStatus(p.status)+"</td><td><span class=\"plan-preview\" title=\""+esc(note)+"\">"+esc(note)+"</span></td></tr><tr id=\""+detailId+"\" class=\"plan-details-row "+groupClass+"\" hidden><td colspan=\"8\"><div class=\"plan-details-grid\">"+details+"</div></td></tr>";
      }).join("");
      return scheduleControls(visible.length)+"<div class=\"summary-grid\"><div class=\"summary\"><div class=\"summary-label\">全部任务</div><div class=\"summary-value\">"+plans.length+"</div><div class=\"summary-note\">已完成 "+done+" 项</div></div><div class=\"summary\"><div class=\"summary-label\">进行中</div><div class=\"summary-value\">"+doing+"</div><div class=\"summary-note\">按当前排期状态</div></div><div class=\"summary\"><div class=\"summary-label\">存在阻塞</div><div class=\"summary-value\">"+blocked+"</div><div class=\"summary-note\">点击任务查看原因</div></div></div><div class=\"plan-wrap\"><table class=\"plan-table\"><thead><tr><th>序号</th><th>优先级</th><th>模块 / 任务</th><th>关联需求</th><th>执行人</th><th>预计完成</th><th>状态</th><th>备注</th></tr></thead><tbody>"+(rows||"<tr><td colspan=\"8\">没有匹配任务</td></tr>")+"</tbody></table></div>";
    }
    function render(){
      renderTabs();renderSnapshot();renderCatalog();
      const arr=state.mode==="plan"?[]:allItems(state.mode);
      if(state.mode!=="plan"){
        document.getElementById("shell").classList.remove("plan-mode");
        if(!arr.length){state.selectedId=null;document.getElementById("detail").innerHTML=catalogFilters[state.mode]?"<div class=\"empty\">没有匹配条目</div>":emptyState(state.mode);return}
        const x=arr.find(y=>y.id===state.selectedId)||arr[0];
        state.selectedId=x.id;
        document.getElementById("catalog").querySelectorAll("[data-record]").forEach(b=>b.classList.toggle("active",b.dataset.record===x.id));
        const body=state.mode==="requirements"?renderRequirements(x):state.mode==="apis"?renderApis(x):state.mode==="existingInterfaces"?renderExistingInterfaces(x):state.mode==="tables"?renderTables(x):state.mode==="architecture"?renderArchitecture(x):renderConfigs(x);
        document.getElementById("detail").innerHTML=body+"<p class=\"footer-note\">本页面是人和 AI 的对齐记录；它不会读取实时仓库或数据库，也不会自动执行 DDL 和上线配置。</p>";
        document.getElementById("shell").classList.remove("plan-mode");
        if(state.mode==="architecture")renderMermaidDiagrams();
        return;
      }
      document.getElementById("shell").classList.add("plan-mode");
      document.getElementById("detail").innerHTML="<header class=\"page-head\"><h1 class=\"page-title\">需求排期</h1></header>"+(plans.length?renderPlan():emptyState("plan"))+"<p class=\"footer-note\">排期只记录协作安排和当前进度；代码、DDL、配置和验证证据分别放在对应分类。</p>";
      document.querySelectorAll("[data-schedule]").forEach(control=>control.onchange=()=>{scheduleState[control.dataset.schedule]=control.type==="checkbox"?control.checked:control.value;render()});
      document.querySelectorAll("[data-schedule-reset]").forEach(button=>button.onclick=()=>{Object.assign(scheduleState,{status:"",sort:"priority",group:true});render()});
      document.querySelectorAll("[data-plan-requirement]").forEach(button=>button.onclick=()=>{state.mode="requirements";state.selectedId=button.dataset.planRequirement;render()});
      document.querySelectorAll("[data-plan-toggle]").forEach(button=>button.onclick=()=>{
        const row=button.closest("tr").nextElementSibling;
        row.hidden=!row.hidden;
        button.setAttribute("aria-expanded",String(!row.hidden));

      });
    }
    const closeSnapshotPanels=()=>document.getElementById("snapshot").querySelectorAll(":scope > details[open]").forEach(details=>details.open=false);
    document.addEventListener("click",event=>{if(!document.getElementById("snapshot").contains(event.target))closeSnapshotPanels()});
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closeSnapshotPanels()});
    window.__HTML_SDD__={baseline,agents,requirements,plans,apis,existingInterfaces,tables,architecture,configs,questions,readiness,sectionCoverage};
    render();
    })();
  </script>
</body>
</html>
