    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}code{font-size:.92em;overflow-wrap:anywhere}

    .tabbar{height:46px;position:sticky;top:56px;z-index:7;display:flex;align-items:stretch;gap:3px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}.tab{position:relative;flex:0 0 auto;padding:0 14px;border:0;background:transparent;color:#64716b;font-size:12px;font-weight:800;white-space:nowrap}.tab:hover{background:#f7faf8;color:var(--ink)}.tab.active{color:var(--accent)}.tab.active:after{position:absolute;right:10px;bottom:-1px;left:10px;height:2px;background:var(--accent);content:""}
    .snapshot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:18px auto 0;max-width:1280px;padding:0 22px}.snapshot-item{min-width:0;padding:9px 11px;background:#fff;border:1px solid var(--line);border-radius:8px}.snapshot-label{color:var(--muted);font-size:10px}.snapshot-value{margin-top:2px;overflow:hidden;font-size:11px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 120px);max-width:1320px;margin:0 auto}.shell.plan-mode{display:block}.shell.plan-mode .sidebar{display:none}.sidebar{position:sticky;top:102px;height:calc(100vh - 102px);overflow:auto;padding:18px 11px 32px;background:var(--side);border-right:1px solid var(--line)}.catalog-title{padding:2px 9px 12px;color:#4d5c54;font-size:12px;font-weight:800}.catalog-count{float:right;color:#98a39d;font-size:10px;font-weight:600}.catalog-group{margin-top:14px}.catalog-group:first-child{margin-top:0}.catalog-group-heading{display:flex;align-items:center;gap:6px;padding:4px 9px 6px;color:#48584f;font-size:13px;font-weight:800}.catalog-group-heading:before{width:3px;height:13px;border-radius:2px;background:var(--accent);content:""}.catalog-item{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr);gap:7px;align-items:center;margin:2px 0;padding:8px;border:0;border-radius:7px;background:transparent;color:#536159;text-align:left}.catalog-item:hover{background:var(--side-hover);color:var(--ink)}.catalog-item.active{background:var(--accent-soft);color:#245c47;box-shadow:inset 2px 0 var(--accent)}.catalog-code{font:800 10px ui-monospace,monospace;color:#87948c;white-space:nowrap}.catalog-name{overflow:hidden;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.catalog-status{grid-column:2;color:#89958e;font-size:9px}
    main{min-width:0;padding:22px clamp(18px,3vw,40px) 54px}.detail{max-width:1120px;margin:0 auto}.page-head{padding:2px 0 15px;border-bottom:1px solid var(--line)}.page-kicker{margin:0 0 5px;color:var(--muted);font-size:10px;font-weight:800}.page-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.page-title{margin:0;font-size:22px;line-height:1.3;overflow-wrap:anywhere}.page-intro{margin:6px 0 0;color:#5d6b63;font-size:12px}.page-meta{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:10px;color:var(--muted);font-size:10px}.page-meta b{color:#46534b}.card{margin:0 0 14px;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:15px;line-height:1.35}.card-head small{color:var(--muted);font-size:11px}.card-body{padding:16px}.section{margin:0 0 18px}.section:last-child{margin-bottom:0}.section h3{margin:0 0 8px;color:#405047;font-size:12px}.section p{margin:0;color:#59685f;font-size:12px}.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.solution-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.solution-section{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfdfb}.solution-section h3{margin:0 0 6px;font-size:11px}.solution-section p{margin:0;color:#59685f;font-size:11px}.solution-section ol,.solution-section ul{margin:0;padding-left:18px;color:#59685f;font-size:11px}.solution-section li+li{margin-top:4px}
    .status,.change-type,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800;white-space:nowrap}.status.done{background:var(--accent-soft);color:var(--accent)}.status.progress{background:var(--blue-soft);color:var(--blue)}.status.wait{background:var(--amber-soft);color:var(--amber)}.status.blocked{background:var(--red-soft);color:var(--red)}.status.neutral{background:#eef1ef;color:#66736b}.change-type.new{background:var(--blue-soft);color:var(--blue)}.change-type.existing{background:var(--amber-soft);color:var(--amber)}.change-type.reuse{background:var(--accent-soft);color:var(--accent)}.tag{border:1px solid #d7e0da;background:#fff;color:#567066;font:700 10px ui-monospace,monospace}.tag-list{display:flex;flex-wrap:wrap;gap:6px}.callout{padding:10px 12px;border-left:3px solid var(--accent);border-radius:5px;background:var(--accent-soft);color:#3a5d4c;font-size:11px}.callout.warn{border-color:#d39a3e;background:var(--amber-soft);color:#735322}
    .param-grid,.instance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.param-pane{min-width:0}.param-pane h3,.instance-pane h3{margin:0 0 8px;font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px;background:#fff}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:8px 9px;border-bottom:1px solid #e9eeea;text-align:left;vertical-align:top}th{background:#f3f7f4;color:#68766e;font-weight:800;white-space:nowrap}tr:last-child td{border-bottom:0}.field-name{font:700 10px ui-monospace,monospace;color:#295e4c}.instance-pane{min-width:0}.instance-box,.text-box{margin:0;overflow:auto;padding:12px;border-radius:7px;background:#20272d;color:#eef2f0;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.text-box{min-height:66px}.diagram-panel{display:grid;gap:10px}.diagram-view{min-height:180px;display:grid;place-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fbfdfb}.diagram-view svg{max-width:100%;height:auto}.diagram-view-mermaid{display:grid;gap:8px;place-items:center}.diagram-view-mermaid .mermaid{width:100%;margin:0;overflow:auto;text-align:center}.diagram-view-mermaid .mermaid svg{max-width:100%;height:auto}.diagram-fallback{margin:0;width:100%;white-space:pre-wrap;font:11px/1.6 ui-monospace,monospace;color:#495a51}.diagram-fallback-note{margin:0;color:var(--muted);font-size:10px;text-align:center}.diagram-label{color:var(--muted);font-size:10px;font-weight:800}.related{margin-top:13px}.related h3{margin:0 0 7px;color:#405047;font-size:11px}
    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.summary{padding:12px 13px;background:#fff;border:1px solid var(--line);border-radius:8px}.summary-label{color:var(--muted);font-size:10px}.summary-value{margin-top:2px;font-size:20px;font-weight:800}.summary-note{margin-top:2px;color:var(--muted);font-size:10px}.plan-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}.plan-table{width:100%;min-width:1280px;border-collapse:collapse;font-size:11px}.plan-table th{padding:10px 9px;background:#f0f5f1;color:#5b6b61;font-size:10px}.plan-table td{padding:10px 9px;border-bottom:1px solid #e7ede8;vertical-align:top}.plan-table tbody tr:last-child td{border-bottom:0}.plan-table tbody tr:hover{filter:brightness(.985)}.plan-table .status{display:inline-block;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.4;text-align:center}.module-0{background:#fbfdfb}.module-1{background:#f6fbff}.module-2{background:#fffaf2}.module-3{background:#faf7ff}.module-4{background:#fff6f6}
    .empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #cbd6cf;border-radius:8px}.footer-note{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);color:#7d8a82;font-size:10px}
    /* Keep the first screen focused on status; reveal implementation detail on demand. */
    .snapshot{display:block;max-width:1280px;margin:18px auto 0;padding:0 22px}
    .snapshot-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 auto;padding:0}
    .snapshot-version{max-width:none;margin:8px 0 0;padding:0 0 8px;color:var(--muted);font-size:11px}
    .snapshot-version>summary{cursor:pointer;list-style:none}
    .snapshot-version>summary::-webkit-details-marker,.readiness-summary::-webkit-details-marker,.disclosure>summary::-webkit-details-marker{display:none}
    .snapshot-version>summary:before,.disclosure>summary:before{content:"＋";display:inline-block;width:18px;color:var(--accent);font-weight:800}
    .snapshot-version[open]>summary:before,.disclosure[open]>summary:before{content:"－"}
    .version-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
    .readiness-card{padding:0}
    .readiness-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;cursor:pointer;list-style:none}
    .readiness-summary>span:first-child{display:grid;gap:2px}
    .readiness-summary strong{font-size:14px}
    .readiness-summary small{color:var(--muted);font-size:11px}
    .readiness-summary-meta{display:flex;align-items:center;gap:10px;min-width:0}
    .readiness-summary-meta .status{max-width:280px;overflow:hidden;text-overflow:ellipsis}
    .disclosure-label{color:var(--accent);font-size:11px;font-weight:700;white-space:nowrap}
    .disclosure{margin:10px 0;border:1px solid var(--line);border-radius:7px;background:#fff}
    .disclosure>summary{padding:9px 11px;cursor:pointer;color:#46584e;font-size:11px;font-weight:700;list-style:none}
    .disclosure-content{padding:0 11px 12px}
    .disclosure .section{margin:0}
    .instance-grid{margin-top:12px!important}
    .instance-box{max-height:420px}
    .text-disclosure .text-box{max-height:560px}
    .related-disclosure{margin-top:12px}
    .related-disclosure .related{margin:0}
    .acceptance-disclosure{margin-top:10px}
    .plan-table{min-width:1280px;table-layout:fixed}
    .shell.plan-mode{max-width:1680px}
    .shell.plan-mode main{padding-left:20px;padding-right:20px}
    .shell.plan-mode .detail{max-width:none}
    .plan-table{min-width:1600px}
    .plan-table th:nth-child(1),.plan-table td:nth-child(1){width:64px}
    .plan-table th:nth-child(2),.plan-table td:nth-child(2){width:230px}
    .plan-table th:nth-child(3),.plan-table td:nth-child(3){width:150px}
    .plan-table th:nth-child(4),.plan-table td:nth-child(4){width:140px}
    .plan-table th:nth-child(5),.plan-table td:nth-child(5){width:155px}
    .plan-table th:nth-child(6),.plan-table td:nth-child(6){width:120px}
    .plan-table th:nth-child(7),.plan-table td:nth-child(7){width:190px}
    .plan-table th:nth-child(8),.plan-table td:nth-child(8){width:220px}
    .plan-table th:nth-child(9),.plan-table td:nth-child(9){width:95px}
    .plan-table th:nth-child(10),.plan-table td:nth-child(10){width:70px}
    .plan-task{display:grid;gap:3px;min-width:0}
    .plan-task strong{font-size:10px}
    .plan-task span,.plan-preview{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
    .plan-reqs{display:flex;flex-wrap:wrap;gap:3px}
    .plan-req{display:inline-block;padding:2px 5px;border-radius:4px;background:#fff;color:#4e6559;font:700 9px ui-monospace,monospace}
    .plan-toggle{padding:4px 7px;border:1px solid #dce5df;border-radius:5px;background:#fff;color:var(--accent);font-size:10px;font-weight:700}
    .plan-details-row[hidden]{display:none!important}
    .plan-details-row td{padding:12px 14px;background:rgba(255,255,255,.82)}
    .plan-details-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}
    .plan-detail{min-width:0;display:grid;gap:2px}
    .plan-detail.wide{grid-column:1/-1}
    .plan-detail b{color:var(--muted);font-size:10px}
    .plan-detail span{overflow-wrap:anywhere;font-size:11px}
    .status.review{background:var(--violet-soft);color:var(--violet)}.status.invalid{background:#fbe9e9;color:#a63f3f}
    .page-meta{display:none}
    @media print{.snapshot-version,.readiness-card>summary,.disclosure>summary,.plan-toggle{display:none}.disclosure:not([open])>*:not(summary){display:block}.plan-details-row[hidden]{display:table-row}}
    @media print{.topbar,.tabbar,.sidebar,.snapshot{display:none}.shell{display:block;min-height:0}.shell.plan-mode{display:block}main{padding:0}.detail{max-width:none}.card,.plan-wrap{box-shadow:none}.table-wrap,.plan-wrap,.instance-box,.text-box{overflow:visible}}
  </style>
</head>

    async function loadSpec(){
      if(typeof DecompressionStream!=="function")throw new Error("当前浏览器不支持 gzip 解压");
      const compressed=Uint8Array.from(atob(specGzipBase64),character=>character.charCodeAt(0));
      const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
      return JSON.parse(await new Response(stream).text());
    }
    const spec=await loadSpec().catch(error=>{
      const notice=document.createElement("p");
      notice.className="empty-state";
      notice.textContent="无法读取方案内容："+error.message+"。请使用较新的浏览器打开此离线文件。";
      document.getElementById("detail").replaceChildren(notice);
      return null;
    });
    if(!spec)return;
    const baseline=Object.assign({project:(spec.metadata||{}).title||''},spec.baseline||{});
    const agents=spec.agents||[];
    const readiness=(spec.metadata||{}).readiness||{};
    const requirements=spec.requirements||[];
    const plans=spec.plans||[];
    const normalizeInterfaceFields=items=>(items||[]).map(field=>Object.assign({},field,{name:field.name||field.field,location:field.location||field.where,description:field.description||field.desc||'',type:field.type||'string'}));
    const apis=(spec.apis||[]).map(api=>Object.assign({},api,{
      request:normalizeInterfaceFields(api.request),
      response:normalizeInterfaceFields(api.response)
    }));
    const existingInterfaces=(spec.existingInterfaces||[]).map(api=>Object.assign({},api,{
      request:normalizeInterfaceFields(api.request),
      response:normalizeInterfaceFields(api.response)
    }));
    const tables=spec.tables||[];
    const architecture=spec.architecture||[];
    const configs=spec.configs||[];
    const sectionCoverage=(spec.metadata||{}).sectionCoverage||{};
    const tabs=[
      ["requirements","需求"],
      ["plan","排期"],
      ["apis","接口"],
      ["existingInterfaces","现有相关接口梳理"],
      ["tables","数据表"],
      ["architecture","架构设计"],
      ["configs","上线需要配置"]
    ];
    const meta={
      requirements:["需求","先看要达成什么，再看验收和关联项。"],
      plan:["需求排期","一张表看清模块、需求关联、优先级、拆分和 Agent 分工。"],
      apis:["接口","按分组查看新增接口和存量接口变更的入参、出参及实例。"],
      existingInterfaces:["现有相关接口梳理","只看 master 分支已存在的文件/资产相关接口，和本期新增方案分开。"],
      tables:["数据表","区分新增表、存量表变更和存量表复用，只看表作用与 DDL。"],
      architecture:["架构设计","架构图、时序图和技术方案说明卡片可以放在同一个分类下。"],
      configs:["上线需要配置","用黑色文本框列出环境变量、Apollo 和需要人工执行的配置。"]
    };
    const state={mode:"requirements",selectedId:null};
    const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const pretty=o=>typeof o==="string"?o:JSON.stringify(o,null,2);
    const list=v=>Array.isArray(v)?v:[];
    const MERMAID_CDN="https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js";
    let mermaidLoaderPromise=null;
    let mermaidInitialized=false;
    function loadMermaid(){
      if(window.mermaid)return Promise.resolve(window.mermaid);
      if(mermaidLoaderPromise)return mermaidLoaderPromise;
      mermaidLoaderPromise=new Promise((resolve,reject)=>{
        const script=document.createElement("script");
        script.src=MERMAID_CDN;
        script.async=true;
        script.onload=()=>window.mermaid?resolve(window.mermaid):reject(new Error("Mermaid 未提供全局对象"));
        script.onerror=()=>reject(new Error("无法加载 Mermaid CDN"));
        document.head.appendChild(script);
      }).catch(error=>{mermaidLoaderPromise=null;throw error;});
      return mermaidLoaderPromise;
    }
    function mermaidDiagram(source,fallback){
      const text=source||fallback||"待补充图形或文字说明";
      return "<div class=\"diagram-view diagram-view-mermaid\"><pre class=\"mermaid diagram-fallback\" data-mermaid-source=\""+esc(text)+"\">"+esc(text)+"</pre><p class=\"diagram-fallback-note\">网络可用时由 Mermaid CDN 渲染；无网络时保留图源。</p></div>";
    }
    async function renderMermaidDiagrams(){
      const nodes=[...document.querySelectorAll(".diagram-view-mermaid .mermaid")];
      if(!nodes.length)return;
      try{
        const mermaid=await loadMermaid();
        if(!mermaidInitialized){
          mermaid.initialize({startOnLoad:false,securityLevel:"strict",theme:"neutral"});
          mermaidInitialized=true;
        }
        await mermaid.run({nodes});
        nodes.forEach(node=>{
          const note=node.closest(".diagram-view-mermaid")?.querySelector(".diagram-fallback-note");
          if(note)note.hidden=true;
        });
      }catch(error){
        nodes.forEach(node=>{
          node.textContent=node.dataset.mermaidSource||node.textContent;
          const note=node.closest(".diagram-view-mermaid")?.querySelector(".diagram-fallback-note");
          if(note){note.hidden=false;note.textContent="Mermaid 加载失败，当前显示图源。";}
        });
      }
    }
    const PLAN_STATUS_ENUM=Object.freeze(["待拆分","待确认","编码 READY","待开始","进行中","待接入","待执行","待复核","待验收","阻塞","已完成","已取消"]);
    const planStatusClass=s=>({"待拆分":"neutral","待确认":"wait","编码 READY":"progress","待开始":"neutral","进行中":"progress","待接入":"wait","待执行":"wait","待复核":"review","待验收":"wait","阻塞":"blocked","已完成":"done","已取消":"neutral"}[s]||"invalid");
    const planStatus=text=>"<span class=\"status "+planStatusClass(text)+"\">"+esc(text||"未填写")+"</span>";
    const statusClass=s=>/已完成|已实现|已验证|已确认|复用/.test(s)?"done":/阻塞|失败/.test(s)?"blocked":/方案|进行|开发|上线|提案|待确认|待拆分/.test(s)?"progress":/待|未/.test(s)?"wait":"neutral";
    const changeClass=s=>/新增/.test(s)?"new":/变更/.test(s)?"existing":/复用|存量/.test(s)?"reuse":"neutral";
    const agentName=id=>(agents.find(a=>a.id===id)||{}).name||"未安排";
    const allItems=mode=>mode==="requirements"?requirements:mode==="apis"?apis:mode==="existingInterfaces"?existingInterfaces:mode==="tables"?tables:mode==="architecture"?architecture:configs;
    const groupOf=x=>x.group||"未分组";
    const codeOf=(x,mode)=>mode==="apis"||mode==="existingInterfaces"?x.method:mode==="tables"?"TABLE":mode==="architecture"?(x.type==="diagram"?"图":"文"):x.kind||"项";
    const titleOf=(x,mode)=>mode==="apis"||mode==="existingInterfaces"?x.name:mode==="tables"?x.name:x.title;
    function emptyState(mode){
      const key=mode==="plan"?"plans":mode;
      const coverage=sectionCoverage[key]||{};
      const title=coverage.status==="not_applicable"?"本次未涉及":coverage.status==="pending"?"待补充":"这里暂时没有内容";
      const reason=coverage.reason||"可在 questions 或排期中记录原因。";
      return "<div class=\"empty\"><strong>"+esc(title)+"</strong><div>"+esc(reason)+"</div></div>";
    }
    function renderTabs(){
      document.getElementById("tabs").innerHTML=tabs.map(t=>"<button class=\"tab "+(state.mode===t[0]?"active":"")+"\" data-mode=\""+t[0]+"\">"+esc(t[1])+"</button>").join("");
      document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.selectedId=null;render()});
    }
    function renderSnapshot(){
      document.getElementById("projectTitle").textContent=baseline.project;
      document.getElementById("documentState").textContent=readiness.codingReady?"可进入编码":"方案待对齐";
      const updated=(spec.metadata||{}).updatedAt||baseline.inspectedAt||"待记录";
      const rows=[["当前阶段",readiness.codingReady?"可进入编码":"方案对齐中"],["阻塞项",list(readiness.blockingItems).length+" 项"],["更新时间",String(updated).slice(0,10)]];
      const summary=rows.map(r=>"<div class=\"snapshot-item\"><div class=\"snapshot-label\">"+esc(r[0])+"</div><div class=\"snapshot-value\" title=\""+esc(r[1])+"\">"+esc(r[1])+"</div></div>").join("");
      const version=[["仓库",baseline.repository],["分支",baseline.branch],["提交",baseline.commit],["检查时间",(baseline.inspectedAt||"")+" "+(baseline.timezone||"")],["工作树",baseline.worktreeState]];
      const versionHtml=version.map(r=>"<div class=\"snapshot-item\"><div class=\"snapshot-label\">"+esc(r[0])+"</div><div class=\"snapshot-value\" title=\""+esc(r[1])+"\">"+esc(r[1])+"</div></div>").join("");
      document.getElementById("snapshot").innerHTML="<div class=\"snapshot-summary\">"+summary+"</div><details class=\"snapshot-version\"><summary>查看仓库、分支和提交信息</summary><div class=\"version-grid\">"+versionHtml+"</div></details>";
    }
    function renderCatalog(){
      const arr=allItems(state.mode);
      const groups=[...new Set(arr.map(groupOf))];
      document.getElementById("catalogTitle").textContent=state.mode==="plan"?"排期":"条目清单";
      document.getElementById("catalogCount").textContent=state.mode==="plan"?"":arr.length+" 项";
      if(state.mode==="plan"){document.getElementById("catalog").innerHTML="";return}
      document.getElementById("catalog").innerHTML=groups.map(g=>{
        const rows=arr.filter(x=>groupOf(x)===g);
        return "<section class=\"catalog-group\"><div class=\"catalog-group-heading\">"+esc(g)+"</div>"+rows.map(x=>"<button class=\"catalog-item "+(state.selectedId===x.id?"active":"")+"\" data-record=\""+esc(x.id)+"\"><span class=\"catalog-code\">"+esc(codeOf(x,state.mode))+"</span><span class=\"catalog-name\">"+esc(titleOf(x,state.mode))+"</span><span class=\"catalog-status\">"+esc(x.status||x.changeType||"")+"</span></button>").join("")+"</section>";
      }).join("");
      document.querySelectorAll("[data-record]").forEach(b=>b.onclick=()=>{state.selectedId=b.dataset.record;render()});
    }
    function relatedBlock(ids){
      const values=list(ids);
      if(!values.length)return "";
      return "<details class=\"disclosure related-disclosure\"><summary>关联记录（"+values.length+"）</summary><div class=\"disclosure-content\"><div class=\"related\"><div class=\"tag-list\">"+values.map(id=>"<span class=\"tag\">"+esc(id)+"</span>").join("")+"</div></div></div></details>";
    }
    function status(text){return "<span class=\"status "+statusClass(text)+"\">"+esc(text||"待填写")+"</span>"}
    function change(text){return "<span class=\"change-type "+changeClass(text)+"\">"+esc(text||"待判断")+"</span>"}
    function roleNames(primary, ids){
      const values=[primary,...list(ids).filter(id=>id!==primary)].filter(Boolean);
      return values.length?values.map((id,index)=>agentName(id)+(index===0?"（主）":"")).join("、"):"未安排";
    }
    function fieldTable(fields,isRequest){
      const rows=list(fields).map(f=>"<tr><td class=\"field-name\">"+esc(f.name)+"</td>"+(isRequest?"<td>"+esc(f.location||"")+"</td>":"")+"<td>"+esc(f.type||"")+"</td><td>"+esc(f.required||"")+"</td><td>"+esc(f.description||"")+"</td><td>"+esc(f.example||"")+"</td></tr>").join("");
      const head=isRequest?"<th>字段</th><th>位置</th><th>类型</th><th>必填</th><th>说明</th><th>示例</th>":"<th>字段</th><th>类型</th><th>说明</th><th>示例</th>";
      return "<div class=\"table-wrap\"><table><thead><tr>"+head+"</tr></thead><tbody>"+(rows||"<tr><td colspan=\""+(isRequest?6:4)+"\">待补充</td></tr>")+"</tbody></table></div>";
    }
    function renderReadiness(){
      if(!readiness.overall&&!readiness.blockingItems&&!readiness.exitCriteria)return "";
      const blocking=list(readiness.blockingItems);
      const blocks=blocking.map(id=>"<span class=\"tag\">"+esc(id)+"</span>").join("");
      const criteria=list(readiness.exitCriteria).map(item=>"<li>"+esc(item)+"</li>").join("");
      const summary=blocking.length?blocking.length+" 个阻塞项":"暂无阻塞项";
      return "<details class=\"card readiness-card\"><summary class=\"readiness-summary\"><span><strong>编码门禁</strong><small>"+summary+" · 展开查看原因和条件</small></span><span class=\"readiness-summary-meta\">"+status(readiness.overall||"待确认")+"<span class=\"disclosure-label\">查看</span></span></summary><div class=\"card-body\"><div class=\"section\"><h3>当前阻塞项</h3><div class=\"tag-list\">"+(blocks||"<span class=\"tag\">暂无</span>")+"</div></div><div class=\"section\"><h3>达到编码 READY 需要满足</h3><ul>"+(criteria||"<li>待补充</li>")+"</ul></div></div></details>";
    }
    function renderRequirements(x){
      const acceptance=list(x.acceptance);
      const rows=acceptance.map(a=>"<tr><td class=\"field-name\">"+esc(a.id)+"</td><td>"+esc(a.text)+"</td><td>"+status(a.status)+"</td><td>"+esc(a.evidence||"待验证")+"</td></tr>").join("");
      return renderReadiness()+"<div class=\"card\"><div class=\"card-head\"><div><h2>"+esc(x.title)+"</h2><small>"+esc(x.id)+" · "+esc(x.group||"")+"</small></div>"+status(x.status)+"</div><div class=\"card-body\"><div class=\"section\"><h3>要达成什么</h3><p>"+esc(x.summary)+"</p></div><div class=\"section\"><h3>范围</h3><p>"+esc(x.scope||"待补充")+"</p></div><details class=\"disclosure acceptance-disclosure\"><summary>验收标准（"+acceptance.length+" 项）</summary><div class=\"disclosure-content\"><div class=\"table-wrap\"><table><thead><tr><th>ID</th><th>标准</th><th>状态</th><th>证据</th></tr></thead><tbody>"+(rows||"<tr><td colspan=\"4\">待补充</td></tr>")+"</tbody></table></div></div></details>"+relatedBlock(x.related)+"</div></div>";
    }
    function renderApis(x){
      return "<div class=\"card\"><div class=\"card-head\"><div><h2>"+esc(x.name)+"</h2><small>"+esc(x.id)+" · "+esc(x.method)+" <span class=\"mono\">"+esc(x.path)+"</span></small></div><div class=\"tag-list\">"+change(x.changeType)+status(x.status)+"</div></div><div class=\"card-body\"><div class=\"section\"><h3>接口做什么</h3><p>"+esc(x.summary)+"</p></div><div class=\"section\"><h3>当前代码现状</h3><div class=\"callout\">"+esc(x.current||"待核实")+"</div></div><div class=\"param-grid\"><div class=\"param-pane\"><h3>请求参数</h3>"+fieldTable(x.request,true)+"</div><div class=\"param-pane\"><h3>返回参数</h3>"+fieldTable(x.response,false)+"</div></div><div class=\"instance-grid\"><div class=\"instance-pane\"><details class=\"disclosure example-disclosure\"><summary>请求实例</summary><div class=\"disclosure-content\"><pre class=\"instance-box\">"+esc(pretty(x.requestExample))+"</pre></div></details></div><div class=\"instance-pane\"><details class=\"disclosure example-disclosure\"><summary>响应实例</summary><div class=\"disclosure-content\"><pre class=\"instance-box\">"+esc(pretty(x.responseExample))+"</pre></div></details></div></div>"+relatedBlock(x.related)+"</div></div>";
    }
    function renderExistingInterfaces(x){
      const facts=[
        ["实现基线",x.baseline||"master 分支现状"],
        ["路由装配",x.routeOwner||"待核实"],
        ["暴露方式",x.exposure||"待核实"],
        ["代码位置",x.source||"待核实"]
      ].map(item=>"<div class=\"solution-section\"><h3>"+esc(item[0])+"</h3><p>"+esc(item[1])+"</p></div>").join("");
      const notes=list(x.notes).map(item=>"<li>"+esc(item)+"</li>").join("");
      return "<div class=\"card\"><div class=\"card-head\"><div><h2>"+esc(x.name)+"</h2><small>"+esc(x.id)+" · "+esc(x.method)+" <span class=\"mono\">"+esc(x.path)+"</span></small></div>"+status(x.status)+"</div><div class=\"card-body\"><div class=\"section\"><h3>接口职责</h3><p>"+esc(x.summary||"待补充")+"</p></div><div class=\"solution-grid\">"+facts+"</div><div class=\"param-grid\"><div class=\"param-pane\"><h3>请求参数</h3>"+fieldTable(x.request,true)+"</div><div class=\"param-pane\"><h3>返回参数</h3>"+fieldTable(x.response,false)+"</div></div><div class=\"instance-grid\"><div class=\"instance-pane\"><details class=\"disclosure example-disclosure\"><summary>请求实例</summary><div class=\"disclosure-content\"><pre class=\"instance-box\">"+esc(pretty(x.requestExample))+"</pre></div></details></div><div class=\"instance-pane\"><details class=\"disclosure example-disclosure\"><summary>响应实例</summary><div class=\"disclosure-content\"><pre class=\"instance-box\">"+esc(pretty(x.responseExample))+"</pre></div></details></div></div>"+(notes?"<details class=\"disclosure\"><summary>现状边界</summary><div class=\"disclosure-content\"><ul>"+notes+"</ul></div></details>":"")+"</div></div>";
    }
    function renderTables(x){
      return "<div class=\"card\"><div class=\"card-head\"><div><h2>"+esc(x.name)+"</h2><small>"+esc(x.id)+"</small></div><div class=\"tag-list\">"+change(x.changeType)+status(x.status)+"</div></div><div class=\"card-body\"><div class=\"section\"><h3>表作用</h3><p>"+esc(x.purpose)+"</p></div><div class=\"section\"><h3>当前状态</h3><div class=\"callout table-current\">"+esc(x.current||"待核实")+"</div></div><details class=\"disclosure\"><summary>结构差异</summary><div class=\"disclosure-content\"><p>"+esc(x.difference||"待补充")+"</p></div></details><details class=\"disclosure text-disclosure\"><summary>查看 DDL</summary><div class=\"disclosure-content\"><pre class=\"text-box\">"+esc(x.ddl||"-- 待补充")+"</pre></div></details>"+relatedBlock(x.related)+"</div></div>";
    }
    function renderArchitecture(x){
      if(x.type==="solution"){
        return "<div class=\"card\"><div class=\"card-head\"><div><h2>"+esc(x.title)+"</h2><small>"+esc(x.id)+" · "+esc(x.group)+"</small></div>"+status(x.status)+"</div><div class=\"card-body\"><div class=\"solution-grid\"><div class=\"solution-section\"><h3>结论</h3><p>"+esc(x.conclusion)+"</p></div><div class=\"solution-section\"><h3>当前代码现状</h3><p>"+esc(x.current)+"</p></div><div class=\"solution-section\"><h3>实施步骤</h3><ol>"+list(x.steps).map(s=>"<li>"+esc(s)+"</li>").join("")+"</ol></div><div class=\"solution-section\"><h3>影响范围</h3><p>"+esc(x.impact)+"</p></div><div class=\"solution-section\"><h3>风险与待确认</h3><p>"+esc(x.risks)+"</p></div></div>"+relatedBlock(x.related)+"</div></div>";
      }
      const engine=x.diagramEngine||(x.diagramSource?"mermaid":"svg/fallback");
      const useMermaid=x.diagramSource&&engine==="mermaid";
      const diagram=x.diagramSvg&&engine!=="mermaid"?"<div class=\"diagram-view\">"+x.diagramSvg+"</div>":useMermaid?mermaidDiagram(x.diagramSource,x.fallback):"<div class=\"diagram-view\"><pre class=\"diagram-fallback\">"+esc(x.fallback||"待补充图形或文字说明")+"</pre></div>";
      return "<div class=\"card\"><div class=\"card-head\"><div><h2>"+esc(x.title)+"</h2><small>"+esc(x.id)+" · "+esc(x.diagramType||"diagram")+" · "+esc(engine)+" · "+esc(x.group)+"</small></div>"+status(x.status)+"</div><div class=\"card-body\"><div class=\"section\"><h3>图要表达什么</h3><p>"+esc(x.summary||"待补充")+"</p></div><div class=\"diagram-panel\"><div class=\"diagram-label\">图形</div>"+diagram+"<div class=\"diagram-label\">图源（网络不可用时可读）</div><pre class=\"text-box\">"+esc(x.diagramSource||x.fallback||"待补充")+"</pre></div>"+relatedBlock(x.related)+"</div></div>";
    }
    function renderConfigs(x){
      return "<div class=\"card\"><div class=\"card-head\"><div><h2>"+esc(x.title)+"</h2><small>"+esc(x.id)+" · "+esc(x.kind)+" · "+esc(x.environment)+"</small></div>"+status(x.status)+"</div><div class=\"card-body\"><div class=\"section\"><h3>上线配置内容</h3><pre class=\"text-box\">"+esc(x.content||"-- 待补充")+"</pre></div><div class=\"callout warn\">只展示需要填写或执行的文本，不在这里执行配置；不要写入 Token、密码、Cookie、私钥。</div>"+relatedBlock(x.related)+"</div></div>";
    }
    function renderPlan(){
      const done=plans.filter(p=>p.status==="已完成").length;
      const doing=plans.filter(p=>p.status==="进行中").length;
      const blocked=plans.filter(p=>p.status==="阻塞").length;
      const groups=[...new Set(plans.map(p=>p.module))];
      const rows=plans.map((p,i)=>{
        const groupClass="module-"+(groups.indexOf(p.module)%5);
        const requirementIds=list(p.requirementIds);
        const reqChips=requirementIds.map(id=>"<span class=\"plan-req\" title=\""+requirementLabel(id)+"\">"+esc(id)+"</span>").join("");
        const paths=Array.isArray(p.ownerPaths)?p.ownerPaths.join("、"):(p.ownerPaths||"—");
        const detailItems=[["子任务",p.sub||"—",true],["关联需求",requirementIds.map(requirementLabel).join("、")||"—",true],["负责人",agentName(p.owner)],["审核人",roleNames(p.reviewer,p.reviewerIds)],["执行人",roleNames(p.executor,p.executorIds)],["批次",p.batch||"—"],["预估",p.effort||"待估"],["计划时间",(p.start||"待定")+" → "+(p.end||"待定")],["依赖",p.deps||"无"],["文件范围",paths,true],["最新进度",p.progress||"尚未更新",true],["备注",p.note||"无",true],["阻塞原因",p.blocker||"无",true]];
        const details=detailItems.map(item=>"<div class=\"plan-detail"+(item[2]?" wide":"")+"\"><b>"+esc(item[0])+"</b><span>"+esc(item[1])+"</span></div>").join("");
        return "<tr class=\""+groupClass+"\"><td><strong>"+esc(p.priority||"—")+"</strong></td><td><div class=\"plan-task\"><strong>"+esc(p.module||"未分组")+"</strong><span title=\""+esc(p.main||"")+"\">"+esc(p.main||"未填写")+"</span></div></td><td><div class=\"plan-reqs\">"+(reqChips||"—")+"</div></td><td><span class=\"plan-preview\">"+esc(roleNames(p.executor,p.executorIds))+"</span></td><td>"+esc((p.start||"待定")+" → "+(p.end||"待定"))+"</td><td>"+planStatus(p.status)+"</td><td><span class=\"plan-preview\">"+esc(p.progress||"尚未更新")+"</span></td><td><span class=\"plan-preview\">"+esc(p.note||"—")+"</span></td><td>"+(p.blocker?"<span class=\"status blocked\">有阻塞</span>":"—")+"</td><td><button class=\"plan-toggle\" type=\"button\" data-plan-toggle aria-expanded=\"false\">详情</button></td></tr><tr class=\"plan-details-row "+groupClass+"\" hidden><td colspan=\"10\"><div class=\"plan-details-grid\">"+details+"</div></td></tr>";
      }).join("");
      return "<div class=\"summary-grid\"><div class=\"summary\"><div class=\"summary-label\">任务总数</div><div class=\"summary-value\">"+plans.length+"</div><div class=\"summary-note\">已完成 "+done+" 项</div></div><div class=\"summary\"><div class=\"summary-label\">进行中</div><div class=\"summary-value\">"+doing+"</div><div class=\"summary-note\">按当前排期状态</div></div><div class=\"summary\"><div class=\"summary-label\">存在阻塞</div><div class=\"summary-value\">"+blocked+"</div><div class=\"summary-note\">展开对应行查看原因</div></div></div><div class=\"plan-wrap\"><table class=\"plan-table\"><thead><tr><th>优先级</th><th>模块 / 主任务</th><th>关联需求</th><th>执行人</th><th>计划时间</th><th>状态</th><th>最新进度</th><th>备注</th><th>阻塞</th><th>详情</th></tr></thead><tbody>"+(rows||"<tr><td colspan=\"10\">待拆分</td></tr>")+"</tbody></table></div>";
    }
    function requirementLabel(id){const r=requirements.find(x=>x.id===id);return esc(r?r.id+" "+r.title:id)}
    function render(){
      renderTabs();renderSnapshot();renderCatalog();
      const arr=state.mode==="plan"?[]:allItems(state.mode);
      if(state.mode!=="plan"){
        if(!arr.length){document.getElementById("detail").innerHTML=emptyState(state.mode);return}
        const x=arr.find(y=>y.id===state.selectedId)||arr[0];
        state.selectedId=x.id;
        document.getElementById("catalog").querySelectorAll("[data-record]").forEach(b=>b.classList.toggle("active",b.dataset.record===x.id));
        const body=state.mode==="requirements"?renderRequirements(x):state.mode==="apis"?renderApis(x):state.mode==="existingInterfaces"?renderExistingInterfaces(x):state.mode==="tables"?renderTables(x):state.mode==="architecture"?renderArchitecture(x):renderConfigs(x);
        document.getElementById("detail").innerHTML="<header class=\"page-head\"><p class=\"page-kicker\">"+esc(meta[state.mode][0])+"</p><div class=\"page-title-row\"><div><h1 class=\"page-title\">"+esc(titleOf(x,state.mode))+"</h1><p class=\"page-intro\">"+esc(meta[state.mode][1])+"</p></div></div></header>"+body+"<p class=\"footer-note\">本页面是人和 AI 的对齐记录；它不会读取实时仓库或数据库，也不会自动执行 DDL 和上线配置。</p>";
        document.getElementById("shell").classList.remove("plan-mode");
        if(state.mode==="architecture")renderMermaidDiagrams();
        return;
      }
      document.getElementById("shell").classList.add("plan-mode");
      document.getElementById("detail").innerHTML="<header class=\"page-head\"><p class=\"page-kicker\">需求排期</p><div class=\"page-title-row\"><div><h1 class=\"page-title\">按模块拆分任务</h1><p class=\"page-intro\">先扫优先级、模块和状态；展开单行查看完整分工和任务说明。</p></div></div></header>"+(plans.length?renderPlan():emptyState("plan"))+"<p class=\"footer-note\">排期只记录协作安排和当前进度；代码、DDL、配置和验证证据分别放在对应分类。</p>";
      document.querySelectorAll("[data-plan-toggle]").forEach(button=>button.onclick=()=>{
        const row=button.closest("tr").nextElementSibling;
        row.hidden=!row.hidden;
        button.setAttribute("aria-expanded",String(!row.hidden));
        button.textContent=row.hidden?"详情":"收起";
      });
    }
    window.__HTML_SDD__={baseline,agents,requirements,plans,apis,existingInterfaces,tables,architecture,configs,readiness,sectionCoverage};
    render();
    })();
  </script>
</body>
</html>
